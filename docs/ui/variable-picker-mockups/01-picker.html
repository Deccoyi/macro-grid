<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Değişken ekle penceresi</title>
<style>
body{margin:0}
.w{--bg:#232529;--cv:#1c1e22;--raised:#2b2e33;--inset:#16171a;--bd:#35383e;--bds:#46494f;--tx:#e6e7ea;--tx2:#9a9ea6;--txd:#7b7f87;--ac:#d97706;--acm:rgba(217,119,6,.15);font:12px/1.3 "Segoe UI",system-ui,sans-serif;color:var(--tx);width:760px;height:560px;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;overflow:hidden}
.w *{box-sizing:border-box}
.w svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dlg{width:620px;height:460px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;display:grid;grid-template-rows:40px minmax(0,1fr);overflow:hidden}
.hd{display:flex;align-items:center;padding:0 6px 0 12px;border-bottom:1px solid var(--bd)}
.hd h1{margin:0;flex:1;font:600 13px/1 "Segoe UI",system-ui,sans-serif}
.ib{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:4px;background:none;color:var(--tx2);cursor:pointer}
.ib:hover{background:var(--raised);color:var(--tx)}
.bd{display:grid;grid-template-columns:160px minmax(0,1fr);min-height:0}
.cats{border-right:1px solid var(--bd);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cat{display:flex;align-items:center;justify-content:space-between;height:28px;padding:0 10px;border:0;border-radius:4px;background:none;color:var(--tx2);font:12px "Segoe UI",system-ui,sans-serif;text-align:left;width:100%;cursor:pointer}
.cat:hover{background:var(--raised);color:var(--tx)}
.cat.on{background:var(--raised);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.cat span:last-child{font-size:11px;color:var(--txd)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.sr{position:relative;padding:8px 12px;border-bottom:1px solid var(--bd)}
.sr svg{position:absolute;left:22px;top:16px;color:var(--txd)}
.q{display:block;width:100%;height:28px;padding:0 8px 0 28px;background:var(--inset);border:1px solid var(--bd);border-radius:4px;color:var(--tx);font:12px "Segoe UI",system-ui,sans-serif}
.q:focus{outline:none;border-color:var(--ac)}
.q::placeholder{color:var(--txd)}
.ls{flex:1;min-height:0;overflow:hidden;padding:0 4px 0 0}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:start;width:100%;min-height:48px;padding:8px 12px;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:none;color:var(--tx);font:12px "Segoe UI",system-ui,sans-serif;text-align:left;cursor:pointer}
.it:hover,.it.hv{background:var(--raised)}
.l1{display:flex;align-items:center;gap:8px;min-height:18px}
.nm{font:12px ui-monospace,Consolas,monospace;color:var(--tx)}
.ty{font-size:10.5px;line-height:14px;padding:0 5px;border:1px solid var(--bd);border-radius:3px;background:var(--inset);color:var(--tx2)}
.ds{font-size:11px;line-height:1.4;color:var(--tx2);margin-top:2px}
.ex{font:11px ui-monospace,Consolas,monospace;color:var(--txd);line-height:18px;white-space:nowrap}

body{background:#101114;padding:24px}</style>
</head>
<body>

<div class="w">
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="s" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
</defs></svg>
<div class="dlg" role="dialog" aria-label="Değişken ekle">
<div class="hd"><h1>Değişken ekle</h1><button class="ib" type="button" aria-label="Kapat"><svg class="i"><use href="#x"/></svg></button></div>
<div class="bd">
<div class="cats" role="tablist" aria-label="Kategoriler">
<button class="cat on" type="button" role="tab" aria-selected="true"><span>Tümü</span><span>5</span></button>
<button class="cat" type="button" role="tab" aria-selected="false"><span>Sistem</span><span>5</span></button>
</div>
<div class="main">
<div class="sr"><svg class="i"><use href="#s"/></svg><input class="q" type="text" placeholder="Değişken ara…" aria-label="Değişken ara"></div>
<div class="ls" role="listbox">
<button class="it" type="button" role="option" title="{system.cpu|0}"><div><div class="l1"><span class="nm">{system.cpu}</span><span class="ty">sayı %</span></div><div class="ds">İşlemci kullanımı</div></div><span class="ex">{system.cpu|0}</span></button>
<button class="it hv" type="button" role="option"><div><div class="l1"><span class="nm">{system.mic.active}</span><span class="ty">evet/hayır</span></div><div class="ds">Mikrofon şu an kullanılıyor mu · true / false</div></div><span class="ex">{system.mic.active}</span></button>
<button class="it" type="button" role="option"><div><div class="l1"><span class="nm">{system.uptime}</span><span class="ty">süre</span></div><div class="ds">Bilgisayarın açık kaldığı süre</div></div><span class="ex">{system.uptime}</span></button>
<button class="it" type="button" role="option"><div><div class="l1"><span class="nm">{system.time}</span><span class="ty">zaman</span></div><div class="ds">Şu anki saat</div></div><span class="ex">{system.time|HH:mm}</span></button>
<button class="it" type="button" role="option"><div><div class="l1"><span class="nm">{system.power}</span><span class="ty">metin</span></div><div class="ds">Güç durumu · Değerler: pilde, prizde</div></div><span class="ex">{system.power}</span></button>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
