<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dynamize window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.root{--bg:#1c1e22;--surface:#232529;--raised:#2b2e33;--inset:#16171a;--line:#35383e;--line2:#46494f;--tx:#e6e7ea;--tx2:#9a9ea6;--tx3:#5b5e64;--acc:#d97706;--acc2:#f59e0b;--accon:#1c1e22;--danger:#e0604f}
.root *{box-sizing:border-box}
.root svg{flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.root button{font:inherit;color:inherit;cursor:pointer}
.root :focus-visible{outline:1.5px solid var(--acc);outline-offset:1px}
.win{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line2)}
.title{display:flex;align-items:center;gap:10px;height:48px;padding:0 10px 0 14px;border-bottom:1px solid var(--line)}
.tico{display:flex;align-items:center;justify-content:center;width:26px;height:26px;background:rgba(217,119,6,.15);color:var(--acc2)}
.grip{display:flex;color:var(--tx3);width:14px;justify-content:center;padding-top:7px}
.ib{display:flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--tx2)}
.ib:hover{background:var(--raised);color:var(--tx)}
.ib.del:hover{color:var(--danger)}
.hint{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:11px;color:var(--tx2)}
.sub{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);line-height:28px}
.kw{font-size:12px;font-weight:600;color:var(--tx);line-height:28px}
.rule{display:grid;grid-template-columns:14px 58px minmax(0,1fr);column-gap:10px;padding:12px 10px 12px 12px;border-bottom:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:6px;min-width:0}
.cond{display:grid;grid-template-columns:minmax(0,1.4fr) 128px minmax(0,1fr) 24px 24px;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;background:var(--inset);border:1px solid var(--line);border-radius:4px;font-family:ui-monospace,monospace;font-size:12px;color:var(--tx);text-align:left;min-width:0}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg{color:var(--tx2)}
.chip:hover,.fld:hover{border-color:var(--line2)}
.fld{height:28px;width:100%;padding:0 8px;background:var(--inset);border:1px solid var(--line);border-radius:4px;font:inherit;font-size:12px;color:var(--tx)}
.fld.mono{font-family:ui-monospace,monospace}
.fld:focus{outline:none;border-color:var(--acc)}
.selwrap{position:relative;display:block}
.selwrap select{appearance:none;-webkit-appearance:none;padding-right:24px}
.selwrap svg{position:absolute;right:8px;top:9px;color:var(--tx2);pointer-events:none}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{padding:0 12px;height:28px;background:var(--inset);border:none;border-right:1px solid var(--line);border-radius:0;font-size:11px;font-weight:600;color:var(--tx2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--raised);color:var(--tx);box-shadow:inset 0 -2px 0 var(--acc)}
.add{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;height:24px;padding:0 8px 0 6px;background:transparent;border:1px solid transparent;border-radius:4px;font-size:12px;color:var(--tx2)}
.add:hover{background:var(--raised);color:var(--tx)}
.quick{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.qbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;background:var(--bg);border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--tx)}
.qbtn:hover{border-color:var(--line2)}
.qbtn svg{color:var(--tx2)}
.cf{display:flex;align-items:center;gap:8px;height:28px;width:170px;padding:0 8px;background:var(--inset);border:1px solid var(--line);border-radius:4px}
.cf i{width:15px;height:15px;border-radius:3px;border:1px solid rgba(255,255,255,.18)}
.cf span{font-family:ui-monospace,monospace;font-size:12px;color:var(--tx)}
.res{display:flex;align-items:center;gap:8px}
.res svg.arrow{color:var(--tx3)}
.foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.btn{height:28px;padding:0 14px;border-radius:4px;border:1px solid var(--line);background:var(--raised);font-size:13px;color:var(--tx)}
.btn:hover{border-color:var(--line2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--raised)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--accon);font-weight:600}
.btn.primary:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.danger{color:var(--danger)}
</style>
</helmet>
<div class="root" style="width: 680px; height: 700px; padding: 24px; background: #1c1e22; color: #e6e7ea; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; line-height: 1.35;">
<div class="win">

  <div class="title">
    <span class="tico"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></svg></span>
    <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
      <span style="font-size: 14px; font-weight: 600">Dynamic value</span>
      <span style="font-size: 12px; color: #9a9ea6; font-family: ui-monospace, monospace">Background color</span>
    </div>
    <span style="flex: 1"></span>
    <button type="button" class="ib" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>

  <div class="quick">
    <span class="sub">Quick</span>
    <button type="button" class="qbtn"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M16 5H8a7 7 0 0 0 0 14h8a7 7 0 0 0 0-14zM16 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>On / off</button>
    <button type="button" class="qbtn"><svg width="12" height="12" viewBox="0 0 24 24"><path d="m12 14 4-4M3.34 19a10 10 0 1 1 17.32 0"/></svg>Thresholds</button>
    <button type="button" class="qbtn"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM4.9 4.9l14.2 14.2"/></svg>Unavailable</button>
    <button type="button" class="qbtn" style="border-style: dashed"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5zM2 13l10 5 10-5M2 17.5l10 5 10-5"/></svg>All presets…</button>
    <span style="flex: 1"></span>
    <span style="font-size: 11px; color: #9a9ea6">First match wins.</span>
  </div>

  <!-- Rule 1 -->
  <div class="rule">
    <span class="grip"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01"/></svg></span>
    <span class="kw">If</span>
    <div class="stack" style="gap: 10px">
      <div class="stack">
        <div class="cond">
          <button type="button" class="chip" aria-label="Variable"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></svg><span>vars.system_cpu_usage</span></button>
          <label class="selwrap"><select class="fld" aria-label="Operator"><option>greater than</option><option>less than</option></select><svg width="12" height="12" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></label>
          <input class="fld mono" type="text" value="85" aria-label="Value">
          <button type="button" class="ib" aria-label="Use a variable as value"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></svg></button>
          <span></span>
        </div>
        <button type="button" class="add"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>Condition</button>
      </div>
      <div class="res">
        <span class="sub" style="width: 36px">Then</span>
        <svg class="arrow" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        <div class="cf"><i style="background: #c0392b"></i><span>#c0392b</span></div>
      </div>
    </div>
  </div>

  <!-- Rule 2 -->
  <div class="rule">
    <span class="grip"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01"/></svg></span>
    <span class="kw">Else if</span>
    <div class="stack" style="gap: 10px">
      <div class="stack">
        <div class="cond">
          <button type="button" class="chip" aria-label="Variable"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></svg><span>vars.system_cpu_usage</span></button>
          <label class="selwrap"><select class="fld" aria-label="Operator"><option>greater than</option><option>less than</option></select><svg width="12" height="12" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></label>
          <input class="fld mono" type="text" value="60" aria-label="Value">
          <button type="button" class="ib" aria-label="Use a variable as value"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></svg></button>
          <button type="button" class="ib del" aria-label="Remove condition"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="seg" role="group" aria-label="Combine conditions"><button type="button" class="on">AND</button><button type="button">OR</button><button type="button">XOR</button></div>
        <div class="cond">
          <button type="button" class="chip" aria-label="Variable"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></svg><span>vars.stream_live</span></button>
          <label class="selwrap"><select class="fld" aria-label="Operator"><option>is</option><option>is not</option></select><svg width="12" height="12" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></label>
          <label class="selwrap"><select class="fld mono" aria-label="Value"><option>true</option><option>false</option></select><svg width="12" height="12" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></label>
          <button type="button" class="ib" aria-label="Use a variable as value"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></svg></button>
          <button type="button" class="ib del" aria-label="Remove condition"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <button type="button" class="add"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>Condition</button>
      </div>
      <div class="res">
        <span class="sub" style="width: 36px">Then</span>
        <svg class="arrow" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        <div class="cf"><i style="background: #d97706"></i><span>#d97706</span></div>
        <span style="flex: 1"></span>
        <button type="button" class="add" style="color: #e0604f"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Remove rule</button>
      </div>
    </div>
  </div>

  <!-- Add rule -->
  <div style="padding: 8px 12px; border-bottom: 1px solid var(--line)">
    <button type="button" class="add" style="margin-left: 24px"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>New rule</button>
  </div>

  <!-- Otherwise -->
  <div class="rule" style="border-bottom: none">
    <span></span>
    <span class="kw">Otherwise</span>
    <div class="res">
      <svg class="arrow" width="14" height="14" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      <div class="cf"><i style="background: #16a34a"></i><span>#16a34a</span></div>
      <button type="button" class="ib" aria-label="No change"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <span style="font-size: 11px; color: #9a9ea6">When no rule matches. Empty keeps the widget as it is.</span>
    </div>
  </div>

  <div class="foot">
    <button type="button" class="btn ghost danger">Remove dynamic value</button>
    <span style="flex: 1"></span>
    <button type="button" class="btn ghost">Cancel</button>
    <button type="button" class="btn primary">Apply</button>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":680,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
