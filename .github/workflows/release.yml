name: Release

# Runs when a tag such as server-v1.0.0-beta is pushed. It builds the release folder with scripts/publish.ps1, zips it,
# builds the Windows installer with Inno Setup and attaches both to a DRAFT GitHub Release (nothing is published until the
# maintainer publishes the draft). The installer is built on every run because the app's own updater downloads
# MacroGrid-Setup-<version>.exe from the release. The release body is the section of docs/CHANGELOG.md for that version
# (scripts/release-notes.ps1), since the update window shows it.
on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (for example server-v1.0.0-beta); the tag must already exist"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check that the tag matches the version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^server-v(\d+\.\d+\.\d+)(-beta)?$') { throw "The tag '$env:TAG' must look like server-vX.Y.Z or server-vX.Y.Z-beta." }
          $tagVersion = $Matches[1]
          if ((Get-Content Directory.Build.props -Raw) -notmatch '<Version>(\d+\.\d+\.\d+)</Version>') { throw "No <Version> in Directory.Build.props" }
          if ($Matches[1] -ne $tagVersion) { throw "The tag says $tagVersion but Directory.Build.props says $($Matches[1])." }

      - name: Test
        run: dotnet test -c Release

      - name: Stop on known vulnerable dependencies
        shell: pwsh
        run: scripts/check-vulnerabilities.ps1

      - name: Publish the release folder
        shell: pwsh
        run: scripts/publish.ps1

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $version = (Get-Content artifacts/server/version.txt -Raw).Trim()
          $zip = "MacroGrid-Server-$version-win-x64.zip"
          Compress-Archive -Path artifacts/server/* -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build the installer
        shell: pwsh
        run: installer/build-installer.ps1

      - name: Write the software bill of materials
        shell: pwsh
        run: scripts/sbom.ps1

      - name: Write the release notes
        shell: pwsh
        run: scripts/release-notes.ps1 -Tag $env:TAG | Set-Content artifacts/release-notes.md -Encoding utf8

      - name: Upload to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("${{ steps.zip.outputs.zip }}")
          if (Test-Path artifacts) { $files += (Get-ChildItem artifacts -Filter "MacroGrid-Setup-*.exe" | ForEach-Object FullName) }
          $files += (Get-ChildItem artifacts/sbom -Filter "*.cdx.json" | ForEach-Object FullName)
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --draft --prerelease --title "Macro Grid server $($env:TAG -replace '^server-v','')" --notes-file artifacts/release-notes.md
          }
          gh release upload $env:TAG @files --clobber
