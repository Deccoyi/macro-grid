name: Release

# Runs when a tag such as server-v0.2.0-alpha is pushed. It builds the release folder with scripts/publish.ps1, zips it
# and attaches it to a DRAFT GitHub Release (nothing is published until the maintainer publishes the draft).
# The installer needs Inno Setup, so it is only built on a manual run with "installer" ticked.
on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (for example server-v0.2.0-alpha); the tag must already exist"
        required: true
        type: string
      installer:
        description: "Also build the Windows installer (installs Inno Setup on the runner)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: dotnet test -c Release

      - name: Publish the release folder
        shell: pwsh
        run: scripts/publish.ps1

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $version = (Get-Content artifacts/server/version.txt -Raw).Trim()
          $zip = "MacroGrid-Server-$version-win-x64.zip"
          Compress-Archive -Path artifacts/server/* -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.installer }}
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build the installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.installer }}
        shell: pwsh
        run: installer/build-installer.ps1

      - name: Upload to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("${{ steps.zip.outputs.zip }}")
          if (Test-Path artifacts) { $files += (Get-ChildItem artifacts -Filter "MacroGrid-Setup-*.exe" | ForEach-Object FullName) }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --draft --prerelease --title "Macro Grid server $($env:TAG -replace '^server-v','')" --notes "Draft. See docs/release-notes-v0.2.0-alpha.md for the notes."
          }
          gh release upload $env:TAG @files --clobber
