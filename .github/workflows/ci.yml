name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (build and test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release

  frontend:
    name: ${{ matrix.project }} (typecheck, build, test)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: [packages/renderer, editor, webclient]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        # The renderer package has no build script (it is consumed from source); the editor and the deck do.
        if: matrix.project != 'packages/renderer'
        run: npm run build
      - name: Test
        # Only the renderer has tests today.
        if: matrix.project == 'packages/renderer'
        run: npm test
