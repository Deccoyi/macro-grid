name: Publish SDK

# Publishes MacroGrid.Plugin.Abstractions to nuget.org with Trusted Publishing: no API key is stored anywhere.
# nuget.org exchanges this run's GitHub identity for a short-lived key. The file name of this workflow is part of the
# trusted-publishing policy on nuget.org, so do not rename it.
#
# Release: bump <Version> in src/MacroGrid.Plugin.Abstractions/MacroGrid.Plugin.Abstractions.csproj (and PluginSdk.Version),
# commit, then push the tag:  git tag sdk-v0.3.0 && git push origin sdk-v0.3.0
on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Pack and push
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write   # lets NuGet/login request the OIDC token
    steps:
      # Actions are pinned to full commit SHAs because this job can obtain a publish key; a moved tag cannot change them.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0              # full history for the branch check below
          persist-credentials: false  # keep the GitHub token out of .git/config during the build

      - name: Check that the tag points at a commit on dev or main
        shell: bash
        run: |
          git fetch --no-tags origin dev main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev || git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is on dev or main."
          else
            echo "::error::The tag must point at a commit that is already on dev or main."; exit 1
          fi

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Check that the tag matches the package version
        shell: bash
        run: |
          project=src/MacroGrid.Plugin.Abstractions/MacroGrid.Plugin.Abstractions.csproj
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$project" | head -n1)
          sdk=$(sed -n 's:.*Version = "\(.*\)";.*:\1:p' src/MacroGrid.Plugin.Abstractions/PluginSdk.cs | head -n1)
          tag="${GITHUB_REF_NAME#sdk-v}"
          echo "tag=$tag csproj=$version PluginSdk.Version=$sdk"
          test -n "$version" && test "$tag" = "$version" && test "$sdk" = "$version" \
            || { echo "::error::Tag, <Version> in the csproj and PluginSdk.Version must be identical."; exit 1; }

      - name: Pack
        run: dotnet pack src/MacroGrid.Plugin.Abstractions -c Release -o artifacts/nuget

      - name: Log in to nuget.org (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org user name (profile name), not the e-mail address.
          user: ${{ secrets.NUGET_USER }}

      # The temporary key is valid for one hour, so push right after logging in. The .snupkg goes along automatically.
      - name: Push
        run: >
          dotnet nuget push "artifacts/nuget/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
