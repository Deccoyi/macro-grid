name: Publish SDK

# Publishes MacroGrid.Plugin.Abstractions to nuget.org with Trusted Publishing: no API key is stored anywhere.
# nuget.org exchanges this run's GitHub identity for a short-lived key. The file name of this workflow is part of the
# trusted-publishing policy on nuget.org, so do not rename it.
#
# The server and the SDK carry one version (docs/guides/versioning.md), so the SDK's version is set by the same tag as the
# server release (release.yml builds the installer from it). But most server releases do not touch the SDK, and a NuGet
# version can never be replaced once pushed, so this job only actually publishes when src/MacroGrid.Plugin.Abstractions
# differs from the previous server-v* tag: a plugin author is told to use the newest published SDK version, not the newest
# server version (docs/guides/versioning.md). Release: set <Version> in Directory.Build.props, commit, then push the tag:
#   git tag server-v1.0.0-beta && git push origin server-v1.0.0-beta
# The tag may end in "-beta" (the GitHub pre-release label); only the MAJOR.MINOR.PATCH before it is compared with <Version>.
on:
  push:
    tags: ["server-v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Pack and push
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write   # lets NuGet/login request the OIDC token
    steps:
      # Actions are pinned to full commit SHAs because this job can obtain a publish key; a moved tag cannot change them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # full history for the branch check below
          persist-credentials: false  # keep the GitHub token out of .git/config during the build

      - name: Check that the tag points at a commit on dev or main
        shell: bash
        run: |
          # fetch-depth: 0 above already brought every branch; no further fetch (no credentials are kept in the checkout)
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev || git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is on dev or main."
          else
            echo "::error::The tag must point at a commit that is already on dev or main."; exit 1
          fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check that the tag matches the version
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)</Version>.*:\1:p' Directory.Build.props | head -n1)
          if [[ ! "$GITHUB_REF_NAME" =~ ^server-v([0-9]+\.[0-9]+\.[0-9]+)(-beta)?$ ]]; then
            echo "::error::The tag must look like server-vX.Y.Z or server-vX.Y.Z-beta."; exit 1
          fi
          tag="${BASH_REMATCH[1]}"
          echo "tag=$GITHUB_REF_NAME core=$tag Directory.Build.props=$version"
          test -n "$version" && test "$tag" = "$version" \
            || { echo "::error::The tag's version and <Version> in Directory.Build.props must be identical."; exit 1; }
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check whether the SDK itself changed since the previous server release
        id: sdk-diff
        shell: bash
        run: |
          prev=$(git describe --tags --match 'server-v*' --exclude "$GITHUB_REF_NAME" --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "No previous server-v* tag found; publishing (first release or history not reachable)."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$prev" -- src/MacroGrid.Plugin.Abstractions; then
            echo "src/MacroGrid.Plugin.Abstractions is unchanged since $prev; skipping the NuGet publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "src/MacroGrid.Plugin.Abstractions changed since $prev; publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        if: steps.sdk-diff.outputs.changed == 'true'
        run: dotnet pack src/MacroGrid.Plugin.Abstractions -c Release -o artifacts/nuget

      - name: Check the package version
        if: steps.sdk-diff.outputs.changed == 'true'
        shell: bash
        run: test -f "artifacts/nuget/MacroGrid.Plugin.Abstractions.${PACKAGE_VERSION}.nupkg" || { echo "::error::The package is not version ${PACKAGE_VERSION}."; ls artifacts/nuget; exit 1; }

      - name: Log in to nuget.org (trusted publishing)
        if: steps.sdk-diff.outputs.changed == 'true'
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org user name (profile name), not the e-mail address.
          user: ${{ secrets.NUGET_USER }}

      # The temporary key is valid for one hour, so push right after logging in. The .snupkg goes along automatically.
      - name: Push
        if: steps.sdk-diff.outputs.changed == 'true'
        run: >
          dotnet nuget push "artifacts/nuget/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
